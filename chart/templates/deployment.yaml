apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tnm.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "tnm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "tnm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tnm.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: output
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
          # Readiness: only route traffic once Flask is up and responding
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          # Liveness: restart pod if Flask stops responding entirely
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          # Startup: give gunicorn + gmpy2 cache build time on cold start
          startupProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: output
          persistentVolumeClaim:
            claimName: {{ include "tnm.fullname" . }}-output
      {{- end }}
