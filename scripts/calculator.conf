# Rate-limit zones — must be in http context; conf.d/ is included inside nginx's http {} block
# SEC-05: 100 calc/min per IP (burst 30), 1 lab test/min per IP
limit_req_zone $binary_remote_addr zone=tnm_calc:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=tnm_lab:10m  rate=1r/m;

server {
    server_name matrixcoders.io;

    location = / {
        return 302 /tnm-calculator/;
    }

    # SEC-03: block external callers from wiping run history
    location /tnm-calculator/stats/history/clear {
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://127.0.0.1:5000/stats/history/clear;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
    }

    # SEC-04: block external callers from injecting fake leaderboard entries
    location /tnm-calculator/stats/history/append {
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://127.0.0.1:5000/stats/history/append;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
    }

    # SEC-05: rate-limit the calculation endpoint (100 req/min per IP, burst 30)
    location /tnm-calculator/calc {
        limit_req        zone=tnm_calc burst=30 nodelay;
        limit_req_status 429;
        proxy_pass          http://127.0.0.1:5000/calc;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  300;
        proxy_buffering     off;
    }

    # SEC-05: rate-limit lab test runner (1 req/min per IP — spawns a subprocess)
    location /tnm-calculator/lab/run-tests {
        limit_req        zone=tnm_lab burst=1 nodelay;
        limit_req_status 429;
        proxy_pass          http://127.0.0.1:5000/lab/run-tests;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_read_timeout  300;
        proxy_buffering     off;
    }

    # Catch-all: strip /tnm-calculator prefix, proxy to Flask, rewrite HTML paths back
    location /tnm-calculator/ {
        proxy_pass          http://127.0.0.1:5000/;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  300;
        proxy_buffering     off;
        proxy_set_header    Accept-Encoding   "";
        sub_filter_once  off;
        sub_filter 'action="/'   'action="/tnm-calculator/';
        sub_filter 'href="/'     'href="/tnm-calculator/';
        sub_filter 'src="/'      'src="/tnm-calculator/';
        sub_filter 'hx-get="/'  'hx-get="/tnm-calculator/';
        sub_filter 'hx-post="/' 'hx-post="/tnm-calculator/';
        sub_filter 'hx-put="/'  'hx-put="/tnm-calculator/';
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/matrixcoders.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/matrixcoders.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = matrixcoders.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name matrixcoders.io;
    return 404; # managed by Certbot


}
