# ─── Image ───────────────────────────────────────────────────────────────────
# Before deploying:
#   1. Create a GAR repository:
#      gcloud artifacts repositories create triangular-number-matrix \
#        --repository-format=docker --location=us-central1 \
#        --project=matrix-coders
#   2. Build and push:
#      docker build -f docker/Dockerfile -t \
#        us-central1-docker.pkg.dev/matrix-coders/triangular-number-matrix/app:latest .
#      docker push us-central1-docker.pkg.dev/matrix-coders/triangular-number-matrix/app:latest
image:
  repository: us-central1-docker.pkg.dev/matrix-coders/triangular-number-matrix/app
  tag: latest
  pullPolicy: Always

# ─── Deployment ──────────────────────────────────────────────────────────────
# Single replica required — app writes to local PVC files (run_history.json,
# leaderboard.json, TN result files). Multiple replicas would race on writes.
replicaCount: 1

# ─── Namespace ───────────────────────────────────────────────────────────────
namespace: triangular-number-matrix

# ─── Resources ───────────────────────────────────────────────────────────────
# Limits: 2 vCPU / 8 GiB — large repdigit calculations are CPU and memory heavy.
# Requests: conservative — gunicorn is idle most of the time.
resources:
  limits:
    cpu: "2"
    memory: 8Gi
  requests:
    cpu: 250m
    memory: 512Mi

# ─── Persistent Volume ───────────────────────────────────────────────────────
# Stores: run_history.json, leaderboard.json, tn-files/, we-files/, stat-files/
# standard-rwo = GKE balanced persistent disk (ReadWriteOnce)
# Increase size here and run `helm upgrade` to expand — GKE supports online resize.
persistence:
  enabled: true
  storageClass: standard-rwo
  size: 20Gi
  accessMode: ReadWriteOnce
  mountPath: /app/static/output

# ─── Service ─────────────────────────────────────────────────────────────────
# ClusterIP — external traffic enters via the Ingress / GCP L7 LB below.
service:
  type: ClusterIP
  port: 80
  targetPort: 5000

# ─── Ingress (GKE L7 HTTPS load balancer) ────────────────────────────────────
# GKE creates a full Google Cloud HTTPS Load Balancer from this Ingress.
# You can attach Cloud Armor policies, URL maps, and backend configs to it
# in the GCP console after the LB is provisioned.
#
# To reserve a static external IP before deploying:
#   gcloud compute addresses create triangular-number-matrix-ip \
#     --global --project=matrix-coders
# Then set staticIpName below to "triangular-number-matrix-ip".
ingress:
  enabled: true
  host: matrixcoders.io
  # staticIpName: ""   # uncomment and set after reserving a static global IP

# ─── GCP Managed Certificate ─────────────────────────────────────────────────
# GKE provisions a Google-managed TLS certificate for the domain automatically.
# DNS must point matrixcoders.io → the Ingress external IP before the cert
# will reach ACTIVE status (usually 10–60 minutes after DNS propagates).
managedCertificate:
  enabled: true
  name: triangular-number-matrix-cert
  domain: matrixcoders.io

# ─── Application environment variables ───────────────────────────────────────
env:
  UI_HTTP_FILE_TRANSFER: "true"
  UI_HTTP_FILE_MAX_DIGITS: "10000000"
