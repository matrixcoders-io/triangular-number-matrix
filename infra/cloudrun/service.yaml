apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: triangular-number-matrix
  # Deploy to us-central1 — same region as your GAR repository
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # ── Scaling / rate limiting ───────────────────────────────────────────
        # maxScale: hard cap on concurrent container instances.
        # Each instance handles up to containerConcurrency (10) requests.
        # 3 instances × 10 concurrency = 30 max simultaneous requests.
        # Raise maxScale if researchers complain about queuing; lower it to
        # tighten the bill cap. Set minScale to 1 to eliminate cold starts
        # (costs ~$10/month to keep one instance warm 24/7).
        autoscaling.knative.dev/maxScale: "3"
        autoscaling.knative.dev/minScale: "0"

        # ── CPU ───────────────────────────────────────────────────────────────
        # false = CPU is always allocated (not just during request handling).
        # Required for long-running calculations — if true, CPU throttles to
        # near-zero between requests which breaks multi-second computations.
        run.googleapis.com/cpu-throttling: "false"

        # ── GCS volume mount ─────────────────────────────────────────────────
        # Mounts the GCS bucket as a POSIX filesystem at /app/static/output.
        # run_history.json, leaderboard.json, and TN output files persist here
        # across container restarts and redeploys. No code changes required.
        run.googleapis.com/execution-environment: gen2

    spec:
      # Max concurrent requests per container instance before Cloud Run
      # spins up a new instance (up to maxScale).
      containerConcurrency: 10

      # Max seconds a single request can run. 3600 = 1 hour.
      # Covers the longest possible triangular number calculation.
      timeoutSeconds: 3600

      # Service account that has read/write on the GCS bucket.
      # Created by setup.sh — do not change this name without updating setup.sh.
      serviceAccountName: tnm-cloudrun@matrix-coders.iam.gserviceaccount.com

      containers:
        - image: us-central1-docker.pkg.dev/matrix-coders/triangular-number-matrix/app:latest

          ports:
            - name: http1
              containerPort: 5000

          # ── Resources ──────────────────────────────────────────────────────
          # 2 vCPU / 8 GiB — matches your GKE limits.
          # Cloud Run bills for actual CPU+memory used per 100ms, not reserved.
          resources:
            limits:
              cpu: "2"
              memory: 8Gi

          env:
            - name: UI_HTTP_FILE_TRANSFER
              value: "true"
            - name: UI_HTTP_FILE_MAX_DIGITS
              value: "10000000"

          volumeMounts:
            - name: gcs-output
              mountPath: /app/static/output

      volumes:
        - name: gcs-output
          csi:
            driver: gcsfuse.run.googleapis.com
            readOnly: false
            volumeAttributes:
              # Bucket created by setup.sh
              bucketName: matrix-coders-tnm-output
